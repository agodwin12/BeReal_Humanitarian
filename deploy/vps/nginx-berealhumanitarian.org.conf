# Be Real Humanitarian Works — real domain virtual hosts.
# Installed as /etc/nginx/sites-available/bereal-org (linked from sites-enabled).
# HTTP only here: certbot --nginx adds the TLS blocks and the http -> https redirects
# (see deploy/vps/switch-domain.sh).
#
#   berealhumanitarian.org         -> website    (pm2 bereal-web, 127.0.0.1:3002)
#   www.berealhumanitarian.org     -> redirect to berealhumanitarian.org
#   portal.berealhumanitarian.org  -> backoffice (pm2 bereal-backoffice, 127.0.0.1:3003)
#   api.berealhumanitarian.org     -> API + media (pm2 bereal-api, 127.0.0.1:4000)

server {
    listen 80;
    server_name berealhumanitarian.org;

    client_max_body_size 2M;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name www.berealhumanitarian.org;

    # Inside a location so certbot's ACME challenge location still works.
    location / {
        return 301 https://berealhumanitarian.org$request_uri;
    }
}

server {
    listen 80;
    server_name portal.berealhumanitarian.org;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    server_name api.berealhumanitarian.org;

    # Media uploads go through the API (photos 15 MB, gallery videos 200 MB).
    client_max_body_size 210M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
