# After the move to berealhumanitarian.org, the temporary nip.io names only
# redirect there (HTTP and HTTPS, reusing the "bereal-nip" certificate so old
# https links do not error). Installed over /etc/nginx/sites-available/bereal
# by deploy/vps/switch-domain.sh.

server {
    listen 80;
    listen 443 ssl;
    server_name bereal.31.97.53.16.nip.io;
    ssl_certificate /etc/letsencrypt/live/bereal-nip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bereal-nip/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / { return 301 https://berealhumanitarian.org$request_uri; }
}

server {
    listen 80;
    listen 443 ssl;
    server_name bereal-admin.31.97.53.16.nip.io;
    ssl_certificate /etc/letsencrypt/live/bereal-nip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bereal-nip/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / { return 301 https://portal.berealhumanitarian.org$request_uri; }
}

server {
    listen 80;
    listen 443 ssl;
    server_name bereal-api.31.97.53.16.nip.io;
    ssl_certificate /etc/letsencrypt/live/bereal-nip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bereal-nip/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    location / { return 301 https://api.berealhumanitarian.org$request_uri; }
}
