# Be Real Humanitarian Works — nginx virtual hosts (one file, three sites).
# Installed as /etc/nginx/sites-available/bereal and linked from sites-enabled.
#
# Hostnames: until the organization's domain is pointed at this server the
# three sites answer on free nip.io names that resolve to the server's IP.
# To move to the real domain, replace the three server_name lines, reload
# nginx, then run: certbot --nginx -d <site> -d <admin> -d <api>
# and update SITE_URL / BACKOFFICE_URL / API_PUBLIC_URL / CLIENT_URLS in
# backend/.env plus NEXT_PUBLIC_* in the two .env.local files (rebuild).

# Public website -> pm2 "bereal-web" (Next.js, 127.0.0.1:3002)
server {
    listen 80;
    server_name bereal.31.97.53.16.nip.io;

    client_max_body_size 2M;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Staff backoffice -> pm2 "bereal-backoffice" (Next.js, 127.0.0.1:3003)
server {
    listen 80;
    server_name bereal-admin.31.97.53.16.nip.io;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# REST API + uploaded media -> pm2 "bereal-api" (Express, 127.0.0.1:4000)
server {
    listen 80;
    server_name bereal-api.31.97.53.16.nip.io;

    # Media uploads go through the API (15 MB limit in the app).
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
